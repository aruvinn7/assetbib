{% comment %}Isian password dengan tombol mata (tersembunyi bawaan). Pakai:
include "components/_password_field.html" with id="password" name="password" placeholder="…"
Tambah readonly=True dan value=… untuk menampilkan password yang sudah jadi (mis. password baru sekali-tampil).{% endcomment %}
<div class="pw-field">
  <input class="input" type="password" id="{{ id }}" {% if name %}name="{{ name }}"{% endif %} value="{{ value|default:'' }}" {% if readonly %}readonly{% endif %} autocomplete="{% if readonly %}off{% else %}new-password{% endif %}" autocapitalize="none" spellcheck="false" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}>
  <button type="button" class="pw-toggle" data-pw-toggle aria-pressed="false" aria-controls="{{ id }}" aria-label="Tampilkan password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
</div>
